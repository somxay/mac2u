<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mac & DJ Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-ink: #0f172a;
      --brand-gold: #b8925a;
      --brand-glass: rgba(255,255,255,.72);
    }
    body { font-family: 'Noto Sans Lao Looped', 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 12% 0%, #f1f5fb 0%, #f8fafc 42%, #f8fafc 100%); }
    .rounded-2xl-custom { border-radius: 1.75rem; }
    .rounded-3xl-custom { border-radius: 2.25rem; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalPop { from { opacity: 0; transform: scale(.94) translateY(14px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    @keyframes gridFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulseSoft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

    /* ---- Glass surfaces (Apple-store style: soft blur + hairline + long soft shadow) ---- */
    .glass-header {
      background: var(--brand-glass);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-bottom: 1px solid rgba(15,23,42,.06);
    }
    .glass-card {
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 20px 40px -28px rgba(15,23,42,.18);
      border: 1px solid rgba(15,23,42,.04);
    }

    .product-card { animation: fadeInUp .55s cubic-bezier(.16,.84,.44,1) both; transition: transform .38s cubic-bezier(.16,.84,.44,1), box-shadow .38s ease; will-change: transform; }
    .product-card:hover { transform: translateY(-7px); box-shadow: 0 24px 44px -20px rgba(15,23,42,.28); }
    .card-img { transition: transform .7s cubic-bezier(.16,.84,.44,1); }
    .product-card:hover .card-img { transform: scale(1.08); }
    #productGrid { animation: gridFade .4s ease both; }

    .modal-backdrop-fade { animation: fadeIn .22s ease both; backdrop-filter: blur(6px); }
    .modal-pop { animation: modalPop .35s cubic-bezier(.16,.84,.44,1) both; }

    .btn-press { transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, background-color .2s ease; }
    .btn-press:active { transform: scale(.94); }
    .cat-btn { transition: all .3s cubic-bezier(.16,.84,.44,1); }

    .skeleton {
      background: linear-gradient(90deg, #eef1f5 25%, #e2e7ef 37%, #eef1f5 63%);
      background-size: 400px 100%;
      animation: shimmer 1.3s ease infinite;
    }

    /* ---- Ripple micro-interaction (injected by ui.js) ---- */
    .ripple-relative { position: relative; overflow: hidden; }
    .btn-press, .ripple { position: relative; overflow: hidden; }
    .ripple-effect {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,.55);
      transform: scale(0);
      animation: rippleAnim .65s cubic-bezier(.16,.84,.44,1);
      pointer-events: none;
    }
    @keyframes rippleAnim { to { transform: scale(1); opacity: 0; } }

    /* ---- Toast notifications ---- */
    .toast-item { opacity: 0; transform: translateY(-16px) scale(.94); transition: opacity .3s cubic-bezier(.16,.84,.44,1), transform .3s cubic-bezier(.16,.84,.44,1); }
    .toast-item.toast-show { opacity: 1; transform: translateY(0) scale(1); }
    .toast-item.toast-hide { opacity: 0; transform: translateY(-10px) scale(.96); }

    /* ---- Loading ring (spinner premium) ---- */
    .loader-ring { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #e2e8f0; border-top-color: var(--brand-ink); animation: spin .7s linear infinite; }

    /* ---- Currency / filter cross-fade ---- */
    .fade-swap { transition: opacity .22s ease; }
    .fade-swap.fading { opacity: 0; }

    .price-pulse { animation: pulseSoft .5s ease; }
  </style>
</head>

<body class="text-slate-800 antialiased pb-24">

  <header class="sticky top-0 z-40 glass-header px-4 py-3">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-slate-900 text-white flex items-center justify-center shadow-md">
          <i class="fab fa-apple text-lg"></i>
        </div>
        <div>
          <h1 id="brandTitle" class="font-bold text-sm leading-tight">Mac & DJ Store</h1>
          <p id="brandSub" class="text-[11px] text-slate-400">ສິນຄ້າມືສອງຄຸນນະພາບ ມືໜຶ່ງຄຸ້ມຄ່າ</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openWarrantyModal()" class="btn-press bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-2 rounded-xl text-xs font-bold transition shadow-sm flex items-center gap-1"><i class="fas fa-shield-alt"></i> ກວດປະກັນ</button>
        <button onclick="toggleCurrency()" id="currencyBtn" class="btn-press bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition shadow-sm">₭ LAK</button>
        <button onclick="toggleLang()" id="langBtn" class="btn-press bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition shadow-sm">EN</button>
        <!-- ໜ້າຫຼັງບ້ານເປັນໄຟລ໌ static ແຍກຕ່າງຫາກ (admin.html) — ໃຊ້ relative path ຈຶ່ງໃຊ້ໄດ້ທຸກໂດເມນ -->
        <a href="admin.html" target="_blank" rel="noopener"
           class="btn-press bg-slate-900 text-white w-9 h-9 rounded-xl flex items-center justify-center text-xs shadow-sm">
          <i class="fas fa-lock"></i>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-4">
    <div class="glass-card p-4 rounded-3xl-custom space-y-3">
      <div class="relative">
        <i class="fas fa-search absolute left-4 top-3.5 text-slate-400 text-xs"></i>
        <input type="text" id="searchInput" oninput="applyFilters()" placeholder="ຄົ້ນຫາຊື່ສິນຄ້າ, ລຸ້ນເຊັ່ນ M1, Air, Pro, Pioneer..." class="w-full bg-slate-50 border border-slate-200 pl-10 pr-4 py-3 rounded-2xl text-xs focus:outline-none focus:border-slate-400">
      </div>

      <!-- ຟິວເຕີ MacBook -->
      <div id="macFilterSection" style="display:none" class="glass-card p-4 rounded-3xl-custom grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="text-[10px] font-bold text-slate-400 block mb-1 ml-1">RAM</label>
          <select id="filterRam" onchange="fadeSwapGrid(applyFilters)" class="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-medium focus:outline-none">
            <option value="">ທັງໝົດ RAM</option>
            <option value="8">8 GB</option>
            <option value="16">16 GB</option>
            <option value="32">32 GB</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-400 block mb-1 ml-1">SSD STORAGE</label>
          <select id="filterSsd" onchange="fadeSwapGrid(applyFilters)" class="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-medium focus:outline-none">
            <option value="">ທັງໝົດ SSD</option>
            <option value="128">128 GB</option>
            <option value="256">256 GB</option>
            <option value="500">500 / 512 GB</option>
            <option value="1000">1 TB (1000 GB)</option>
          </select>
        </div>
        <div>
          <label id="lblYear" class="text-[10px] font-bold text-slate-400 block mb-1 ml-1">YEAR (ປີຜະລິດ)</label>
          <select id="filterYear" onchange="fadeSwapGrid(applyFilters)" class="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-medium focus:outline-none">
            <option value="">ທັງໝົດ ປີ</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <option value="2020">2020</option>
            <option value="2019">2019</option>
            <option value="2018">2018</option>
          </select>
        </div>
      </div>

      <!-- ຟິວເຕີ ສາຍສາກ / ອຸປະກອນ -->
      <div id="accFilterSection" style="display:none" class="glass-card p-4 rounded-3xl-custom grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="text-[10px] font-bold text-slate-400 block mb-1 ml-1">ປະເພດສາຍສາກ</label>
          <select id="filterAccType" onchange="fadeSwapGrid(applyFilters)" class="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-medium focus:outline-none">
            <option value="">ທັງໝົດ ປະເພດ</option>
            <option value="2012down">ສາຍສາກ ປີ 2012 ລົງມາ (MagSafe 1)</option>
            <option value="2013-2015">ສາຍສາກ ປີ 2013-2015 (MagSafe 2)</option>
            <option value="usbc">USB-C (2016 ຂຶ້ນໄປ)</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-400 block mb-1 ml-1">ຄວາມແຮງ (WATT)</label>
          <select id="filterAccWatt" onchange="fadeSwapGrid(applyFilters)" class="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-medium focus:outline-none">
            <option value="">ທັງໝົດ ວັດ</option>
            <option value="45">45W</option>
            <option value="60">60W</option>
            <option value="85">85W</option>
            <option value="96">96W</option>
          </select>
        </div>
      </div>

      <!-- ຟິວເຕີ ເຄື່ອງ DJ -->
      <div id="djFilterSection" style="display:none" class="glass-card p-4 rounded-3xl-custom grid grid-cols-1 gap-3">
        <div>
          <label class="text-[10px] font-bold text-slate-400 block mb-1 ml-1">ປະເພດເຄື່ອງ DJ</label>
          <select id="filterDjSize" onchange="fadeSwapGrid(applyFilters)" class="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-medium focus:outline-none">
            <option value="">ທັງໝົດ</option>
            <option value="big">ເຄື່ອງໃຫຍ່</option>
            <option value="small">ເຄື່ອງນ້ອຍ</option>
          </select>
        </div>
      </div>

      <!-- ຟິວເຕີ ລົງໂປຮແກຣມ -->
      <div id="swFilterSection" style="display:none" class="glass-card p-4 rounded-3xl-custom grid grid-cols-1 gap-3">
        <div>
          <label class="text-[10px] font-bold text-slate-400 block mb-1 ml-1">ປະເພດຂອງໂປຮແກຣມ</label>
          <select id="filterSwType" onchange="fadeSwapGrid(applyFilters)" class="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-medium focus:outline-none">
            <option value="">ທັງໝົດ</option>
            <option value="macos">ລົງລະບົບ macOS</option>
            <option value="office">Microsoft Office</option>
            <option value="adobe">Adobe (Photoshop / Premiere...)</option>
            <option value="dj">ໂປຮແກຣມ DJ (Serato / Rekordbox...)</option>
            <option value="music">ຕັດຕໍ່ / ດົນຕີ (Logic / FL Studio...)</option>
            <option value="other">ອື່ນໆ</option>
          </select>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 sm:flex sm:gap-2 sm:overflow-x-auto pb-1 scrollbar-none">
      <button onclick="filterCategory('all', this)" class="cat-btn btn-press bg-slate-900 text-white px-3 sm:px-5 py-2.5 rounded-2xl text-[11px] sm:text-xs font-semibold text-center leading-snug sm:whitespace-nowrap shadow-md transition">ທັງໝົດ</button>
      <button onclick="filterCategory('Macbook', this)" class="cat-btn btn-press bg-white text-slate-600 hover:bg-slate-100 px-3 sm:px-5 py-2.5 rounded-2xl text-[11px] sm:text-xs font-semibold text-center leading-snug sm:whitespace-nowrap border border-slate-100 shadow-sm transition">MacBook</button>
      <button onclick="filterCategory('Accessories', this)" class="cat-btn btn-press bg-white text-slate-600 hover:bg-slate-100 px-3 sm:px-5 py-2.5 rounded-2xl text-[11px] sm:text-xs font-semibold text-center leading-snug sm:whitespace-nowrap border border-slate-100 shadow-sm transition">ສາຍສາກ/ອຸປະກອນ</button>
      <button onclick="filterCategory('DJ', this)" class="cat-btn btn-press bg-white text-slate-600 hover:bg-slate-100 px-3 sm:px-5 py-2.5 rounded-2xl text-[11px] sm:text-xs font-semibold text-center leading-snug sm:whitespace-nowrap border border-slate-100 shadow-sm transition">ເຄື່ອງ DJ</button>
      <button onclick="filterCategory('Software', this)" class="cat-btn btn-press bg-white text-slate-600 hover:bg-slate-100 px-3 sm:px-5 py-2.5 rounded-2xl text-[11px] sm:text-xs font-semibold text-center leading-snug sm:whitespace-nowrap border border-slate-100 shadow-sm transition col-span-2 sm:col-span-1">ລົງໂປຣແກຣມ</button>
    </div>

    <div id="loading" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      <div class="bg-white rounded-3xl-custom overflow-hidden shadow-sm"><div class="h-44 skeleton"></div><div class="p-4 space-y-2"><div class="h-2.5 w-1/3 rounded skeleton"></div><div class="h-3.5 w-2/3 rounded skeleton"></div><div class="h-2.5 w-1/2 rounded skeleton"></div></div></div>
      <div class="bg-white rounded-3xl-custom overflow-hidden shadow-sm"><div class="h-44 skeleton"></div><div class="p-4 space-y-2"><div class="h-2.5 w-1/3 rounded skeleton"></div><div class="h-3.5 w-2/3 rounded skeleton"></div><div class="h-2.5 w-1/2 rounded skeleton"></div></div></div>
      <div class="bg-white rounded-3xl-custom overflow-hidden shadow-sm"><div class="h-44 skeleton"></div><div class="p-4 space-y-2"><div class="h-2.5 w-1/3 rounded skeleton"></div><div class="h-3.5 w-2/3 rounded skeleton"></div><div class="h-2.5 w-1/2 rounded skeleton"></div></div></div>
      <div class="bg-white rounded-3xl-custom overflow-hidden shadow-sm hidden sm:block"><div class="h-44 skeleton"></div><div class="p-4 space-y-2"><div class="h-2.5 w-1/3 rounded skeleton"></div><div class="h-3.5 w-2/3 rounded skeleton"></div><div class="h-2.5 w-1/2 rounded skeleton"></div></div></div>
      <div class="bg-white rounded-3xl-custom overflow-hidden shadow-sm hidden md:block"><div class="h-44 skeleton"></div><div class="p-4 space-y-2"><div class="h-2.5 w-1/3 rounded skeleton"></div><div class="h-3.5 w-2/3 rounded skeleton"></div><div class="h-2.5 w-1/2 rounded skeleton"></div></div></div>
      <div class="bg-white rounded-3xl-custom overflow-hidden shadow-sm hidden md:block"><div class="h-44 skeleton"></div><div class="p-4 space-y-2"><div class="h-2.5 w-1/3 rounded skeleton"></div><div class="h-3.5 w-2/3 rounded skeleton"></div><div class="h-2.5 w-1/2 rounded skeleton"></div></div></div>
    </div>

    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
  </main>

  <footer class="max-w-5xl mx-auto px-4 py-8 text-center">
    <p class="text-[10px] text-slate-300">
      © 2026 Mac & DJ Store
      <a href="agent.html" aria-hidden="true" tabindex="-1" class="opacity-20 hover:opacity-60 transition px-1" title="">·</a>
    </p>
  </footer>

  <!-- Modal: Product Details (Popup no new tab, multi image gallery) -->
  <div id="productModal" class="modal-backdrop-fade fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="modal-pop bg-white rounded-3xl-custom shadow-2xl ring-1 ring-slate-900/5 w-full max-w-lg p-6 overflow-y-auto max-h-[90vh] relative">
      <button onclick="closeProductModal()" class="btn-press absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 z-10"><i class="fas fa-times"></i></button>
      <div id="modalBody" class="space-y-4"></div>
    </div>
  </div>

  <!-- Modal: Warranty Check -->
  <div id="warrantyModal" class="modal-backdrop-fade fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="modal-pop bg-white rounded-3xl-custom shadow-2xl ring-1 ring-slate-900/5 w-full max-w-md p-6 relative">
      <button onclick="closeWarrantyModal()" class="btn-press absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200"><i class="fas fa-times"></i></button>
      <h3 class="font-bold text-sm mb-2"><i class="fas fa-shield-alt text-indigo-600 mr-1"></i> ກວດສອບໄລຍະເວລາຮັບປະກັນ</h3>
      <p class="text-[11px] text-slate-400 mb-3">ໃສ່ລະຫັດສິນຄ້າ 6 ຫລັກ ເພື່ອກວດສອບປະກັນ ແລະ ປະຫວັດການສ້ອມແຊມ</p>
      <div class="flex gap-2 mb-3">
        <input type="text" id="warrantyInputCode" placeholder="ລະຫັດ 6 ຫລັກ (ເຊັ່ນ 102938)" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs focus:outline-none">
        <button onclick="checkWarranty()" class="btn-press bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap">ກວດສອບ</button>
      </div>
      <div id="warrantyResultBox" class="space-y-2"></div>
    </div>
  </div>

  <!-- Modal: Share Product -->
  <div id="shareModal" class="modal-backdrop-fade fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
    <div class="modal-pop bg-white rounded-3xl-custom shadow-2xl ring-1 ring-slate-900/5 w-full max-w-xs p-6 relative">
      <button onclick="closeShareModal()" class="btn-press absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200"><i class="fas fa-times"></i></button>
      <h3 class="font-bold text-sm mb-4"><i class="fas fa-share-nodes text-indigo-600 mr-1"></i> ແຊຣ໌ສິນຄ້ານີ້</h3>
      <div class="space-y-2">
        <button onclick="shareViaCopyLink()" class="btn-press w-full flex items-center gap-3 bg-slate-50 hover:bg-slate-100 px-4 py-3 rounded-2xl text-xs font-semibold text-slate-700 transition">
          <span class="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center shrink-0"><i class="fas fa-link text-slate-600"></i></span>
          ຄັດລອກລິ້ງ (Copy Link)
        </button>
        <button onclick="shareViaWhatsApp()" class="btn-press w-full flex items-center gap-3 bg-emerald-50 hover:bg-emerald-100 px-4 py-3 rounded-2xl text-xs font-semibold text-emerald-700 transition">
          <span class="w-9 h-9 rounded-full bg-emerald-500 text-white flex items-center justify-center shrink-0"><i class="fab fa-whatsapp"></i></span>
          WhatsApp
        </button>
        <button onclick="shareViaMessenger()" class="btn-press w-full flex items-center gap-3 bg-indigo-50 hover:bg-indigo-100 px-4 py-3 rounded-2xl text-xs font-semibold text-indigo-700 transition">
          <span class="w-9 h-9 rounded-full bg-indigo-500 text-white flex items-center justify-center shrink-0"><i class="fab fa-facebook-messenger"></i></span>
          Facebook Messenger
        </button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
