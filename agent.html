<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ບໍ່ໃຫ້ Google ຫຼື search engine ອື່ນເກັບ index ໜ້ານີ້ -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>ລາຄາສົ່ງ - Mac & DJ Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/liquid-glass.css">
  <style>
    #loginScreen, #gateScreen { animation: fadeIn .25s ease both; }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <!-- ==================== ໜ້າຖາມລະຫັດຕົວແທນ ==================== -->
  <div id="gateScreen" class="min-h-screen flex items-center justify-center p-5">
    <div class="glass-card w-full max-w-sm p-7 rounded-3xl-custom shadow-xl">
      <div class="w-12 h-12 rounded-2xl bg-slate-900 text-white flex items-center justify-center shadow-md mb-4">
        <i class="fas fa-tags"></i>
      </div>
      <h2 class="font-bold text-lg mb-1">ໜ້າລາຄາສົ່ງ ສຳລັບຕົວແທນ</h2>
      <p class="text-xs text-slate-400 mb-4">ໃສ່ລະຫັດຕົວແທນ (Agent Code) ເພື່ອເຂົ້າເບິ່ງລາຄາສົ່ງ</p>

      <input id="agentCodeInput" type="password" placeholder="ລະຫັດຕົວແທນ"
             class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm mb-3 focus:outline-none focus:border-slate-400">

      <p id="gateError" class="text-xs text-rose-500 mb-2 hidden">ລະຫັດບໍ່ຖືກຕ້ອງ, ລອງໃໝ່ອີກຄັ້ງ</p>
      <button id="gateSubmitBtn" onclick="checkAgentCode()" class="btn-press w-full bg-slate-900 text-white py-3 rounded-xl text-sm font-semibold">ເຂົ້າສູ່ລະບົບ</button>
      <a href="index.html" class="block text-center text-xs text-slate-400 mt-4 hover:underline">← ກັບຄືນໜ້າຮ້ານ</a>
    </div>
  </div>

  <!-- ==================== ໜ້າລາຄາສົ່ງ (ສະແດງຫຼັງໃສ່ລະຫັດຖືກ) ==================== -->
  <div id="agentContent" class="hidden min-h-screen pb-16">
    <header class="sticky top-0 z-30 glass-header px-4 py-3">
      <div class="max-w-5xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl bg-slate-900 text-white flex items-center justify-center shadow-md">
            <i class="fas fa-tags"></i>
          </div>
          <div>
            <h1 class="font-bold text-sm leading-tight">ລາຄາສົ່ງ - ຕົວແທນ</h1>
            <p class="text-[11px] text-slate-400">Mac & DJ Store — Agent Only</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <a href="index.html" class="btn-press bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition shadow-sm">ໜ້າຮ້ານ</a>
          <button onclick="agentLogout()" class="btn-press bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-2 rounded-xl text-xs font-bold transition shadow-sm">
            <i class="fas fa-right-from-bracket"></i> ອອກຈາກລະບົບ
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 space-y-4">
      <div class="glass-card p-4 rounded-3xl-custom text-xs text-slate-500">
        <i class="fas fa-circle-info text-indigo-500 mr-1"></i>
        ລາຄາໃນໜ້ານີ້ເປັນລາຄາສົ່ງສະເພາະຕົວແທນເທົ່ານັ້ນ, ຫ້າມເຜີຍແຜ່ຕໍ່ລູກຄ້າທົ່ວໄປ
      </div>

      <div id="agentLoading" class="space-y-2">
        <div class="bg-white rounded-2xl p-4 shadow-sm h-20 skeleton"></div>
        <div class="bg-white rounded-2xl p-4 shadow-sm h-20 skeleton"></div>
        <div class="bg-white rounded-2xl p-4 shadow-sm h-20 skeleton"></div>
      </div>

      <div id="agentList" class="divide-y divide-slate-100 glass-card rounded-3xl-custom overflow-hidden"></div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="agent.js"></script>
</body>
</html>
